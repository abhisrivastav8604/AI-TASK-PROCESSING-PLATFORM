name: Continuous Deployment

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  INFRA_REPO: "username/infra-repository" # Replace with actual infra repository
  INFRA_BRANCH: "main"

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-tasks-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/ai-tasks-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ai-tasks-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ai-tasks-backend:buildcache,mode=max

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-tasks-worker:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/ai-tasks-worker:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ai-tasks-worker:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ai-tasks-worker:buildcache,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-tasks-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/ai-tasks-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ai-tasks-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ai-tasks-frontend:buildcache,mode=max

  update-infra:
    name: Update Infrastructure GitOps Repo
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          ref: ${{ env.INFRA_BRANCH }}
          path: infra

      - name: Update Image Tags in Kubernetes Manifests
        working-directory: ./infra
        run: |
          # Use sed to replace the latest tag with the new github sha
          sed -i "s|image: .*/ai-tasks-backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/ai-tasks-backend:${{ github.sha }}|g" k8s/backend/deployment.yaml
          sed -i "s|image: .*/ai-tasks-worker:.*|image: ${{ secrets.DOCKER_USERNAME }}/ai-tasks-worker:${{ github.sha }}|g" k8s/worker/deployment.yaml
          sed -i "s|image: .*/ai-tasks-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/ai-tasks-frontend:${{ github.sha }}|g" k8s/frontend/deployment.yaml

      - name: Commit and Push Changes
        working-directory: ./infra
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/*/deployment.yaml
          git commit -m "chore: auto-update images to sha ${{ github.sha }} [skip ci]"
          git push origin ${{ env.INFRA_BRANCH }}
