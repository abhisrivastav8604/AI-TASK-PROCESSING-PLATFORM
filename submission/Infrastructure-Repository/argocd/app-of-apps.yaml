apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-task-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/username/infra-repository.git' # Replace with actual repo URL
    path: k8s
    targetRevision: HEAD
    directory:
      recurse: true # Tells Argo to search all subdirectories
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ai-task-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
